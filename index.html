<style>:root{--night:#1B0B24;--plum:#3A1344;--berry:#C42F7F;--lake:#2A9AA3;--cream:#FBF7F9;--gold:#FFD36B;--mute:#E4D3EB;--f:'Fredoka','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(120% 80% at 50% 0,#4b1a63 0%,#2a1038 55%,#1B0B24 100%) fixed;color:var(--cream);font-family:var(--f);min-height:100%}
body{padding:10px 12px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:var(--f);cursor:pointer}
.top{width:min(100%,520px);display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.chip{border:0;border-radius:999px;background:#ffffff1f;color:var(--cream);font-weight:600;font-size:1.05rem;padding:10px 16px;min-height:48px}
.chip.big{font-size:1.5rem;padding:6px 18px}
.stars{display:flex;gap:6px;align-items:center;background:#ffffff1f;border-radius:999px;padding:8px 16px;font-weight:700;font-size:1.2rem;min-height:48px}
.view{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.view[hidden]{display:none!important}
.hero{display:flex;flex-direction:column;align-items:center}
.hero svg{width:96px;transform-origin:50% 100%;animation:hop 2.6s cubic-bezier(.3,0,.3,1) infinite}
.hsh{width:60px;height:9px;margin:-2px auto 4px;border-radius:50%;background:radial-gradient(#0009,#0000 70%)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.08,.9)}12%{transform:translateY(0) scale(.94,1.08)}40%{transform:translateY(-30px) rotate(4deg)}58%{transform:translateY(-30px) rotate(-4deg)}82%{transform:translateY(0) scale(1.08,.9)}}
h1{font-size:clamp(1.8rem,8vw,2.4rem);margin:0;font-weight:700}
h1 span{color:#F36CAE}
.sub{margin:0;color:var(--mute);font-weight:500;font-size:1.1rem}
.grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:0;border-radius:28px;padding:16px 8px 14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s}
.tile:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile .em{font-size:3.6rem;line-height:1}
.tile b{font-size:1.15rem;font-weight:600;line-height:1.1}
.panel{width:100%;background:#ffffff12;border:2px solid #ffffff22;border-radius:28px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.big-em{font-size:min(30vw,9rem);line-height:1}
.big-l{font-size:min(36vw,10rem);font-weight:700;line-height:1;color:var(--gold);text-shadow:0 6px 0 rgba(0,0,0,.25)}
.word{font-size:2rem;font-weight:700}
.choices{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ch{border:0;border-radius:24px;background:linear-gradient(180deg,#ffffff,#EFE2F4);color:#3A1344;font-size:min(14vw,3.6rem);font-weight:700;min-height:92px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .12s}
.ch:active{transform:translateY(4px)}
.ch.ok{background:linear-gradient(180deg,#8CF0B4,#38C97E);color:#0B3D22}
.ch.no{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.nav{display:flex;gap:14px;width:100%;justify-content:center}
.btn{border:0;border-radius:999px;background:linear-gradient(180deg,#E24A98,#B02270);color:#fff;font-size:1.4rem;font-weight:700;padding:14px 28px;min-height:60px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(3px)}
.btn.alt{background:linear-gradient(180deg,#43C7CF,#1F8790)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lg{border:0;border-radius:16px;background:#ffffff26;color:#fff;font-size:1.7rem;font-weight:700;min-height:58px}
.lg.on{background:var(--gold);color:#3A1344}
.objs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:min(13vw,3.4rem);line-height:1.1}
.objs button{border:0;background:none;font-size:inherit;padding:2px;transition:transform .15s}
.objs button.c{transform:scale(1.25)}
.cnt{font-size:3rem;font-weight:700;color:var(--gold);min-height:3.4rem}
.blobs{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.blob{border:0;border-radius:28px;min-height:120px;box-shadow:0 6px 0 rgba(0,0,0,.28);display:grid;place-items:center}
.blob:active{transform:translateY(4px)}
.blob svg{width:70%;height:70%}
.mem{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mc{aspect-ratio:1/1.1;border:0;border-radius:22px;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.mc.open .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;backface-visibility:hidden;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.mc .f{background:linear-gradient(160deg,#E24A98,#7A2F8C)}
.mc .f svg{width:46%}
.mc .b{background:#fff;font-size:min(16vw,4rem);transform:rotateY(180deg)}
.mc.done .b{background:#C9F5DB}
.animals{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.an{border:0;border-radius:24px;background:#ffffff1f;font-size:min(16vw,4rem);min-height:100px;box-shadow:0 5px 0 rgba(0,0,0,.25);display:grid;place-items:center}
.an.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(1.15) rotate(6deg)}}
.stage{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px #ffffff22,0 14px 40px #0006;background:linear-gradient(#16314f,#1d6a7c)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.msg{min-height:2.4rem;font-size:1.5rem;font-weight:700;color:var(--gold)}
.cf{position:fixed;top:-14px;width:11px;height:16px;border-radius:3px;z-index:90;pointer-events:none;animation:cfall 2.2s ease-in forwards}
@keyframes cfall{to{transform:translate(var(--dx),105vh) rotate(var(--rt))}}
.foot{color:#ffffff88;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.foot b{color:#fff}
@media (prefers-reduced-motion:reduce){.hero svg{animation:none}.cf{display:none}.mc .in{transition:none}}

#intro{position:fixed;inset:0;z-index:99;background:radial-gradient(120% 90% at 50% 40%,#5C1048 0%,#2E0A2A 48%,#14061A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease,visibility .6s}
#intro:not(.go) *{animation-play-state:paused!important}
#intro.out{opacity:0;visibility:hidden}
#intro .burst{will-change:transform,opacity;position:absolute;left:50%;top:40%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,240,.9) 0%,rgba(243,108,174,.5) 28%,rgba(168,36,94,0) 68%);opacity:0;transform:scale(.2);animation:ibur 1.6s .5s ease-out forwards}
@keyframes ibur{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:.25;transform:scale(1.15)}}
#intro svg.mk{position:relative;width:min(58vw,240px);height:auto;overflow:visible;z-index:2;animation:imove 1.1s .35s cubic-bezier(.3,.9,.3,1) both;will-change:transform}
@keyframes imove{0%{transform:translateY(78px) scale(1.12)}100%{transform:none}}
@keyframes iglow{0%{filter:drop-shadow(0 0 0 rgba(243,108,174,0))}35%{filter:drop-shadow(0 0 34px rgba(243,108,174,.9))}100%{filter:drop-shadow(0 0 16px rgba(243,108,174,.5))}}
#intro .dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:idot .5s .15s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes idot{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
#intro .st{position:absolute;border-radius:50%;background:#fff;opacity:0;animation:itw2 3s ease-in-out infinite}
@keyframes itw2{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}
#intro .lf{opacity:1}
#intro .l1{animation:iwig 2.4s .9s ease-in-out both}
#intro .l2{animation:iwig 2.4s 1.05s ease-in-out both}
@keyframes iwig{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}60%{transform:rotate(5deg)}}
#intro .lf{transform-box:fill-box;transform-origin:50% 100%}
@keyframes igrow{0%{opacity:0;transform:scale(0) rotate(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
#intro .face{opacity:1}
@keyframes ipop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
#intro .wm{position:relative;z-index:2;margin-top:10px;font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,13vw,4.4rem);letter-spacing:-.03em;color:#fff;line-height:1;display:flex;overflow:hidden;padding:6px 4px}
#intro .wm span{display:inline-block;opacity:0;transform:translateY(60%) scale(.9);animation:iletter .7s cubic-bezier(.2,.9,.3,1) forwards;will-change:transform,opacity}
#intro .wm span.b{color:#F36CAE}

@keyframes iletter{to{opacity:1;transform:none}}
#intro .tl{position:relative;z-index:2;margin-top:8px;font-weight:800;color:#E9D9F0;opacity:0;animation:ifade .8s 2.1s forwards;font-size:clamp(.95rem,4vw,1.15rem);text-align:center;padding:0 20px}
#intro .by{position:absolute;bottom:34px;left:0;right:0;text-align:center;opacity:0;animation:ifade .8s 2.4s forwards}
#intro .by i{display:block;width:44px;height:2px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.8}
#intro .by small{display:block;font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:#CDB9D6;font-weight:800}
#intro .by b{display:block;margin-top:5px;font-family:var(--f-display);font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;color:#fff}
#intro .sk{position:absolute;bottom:128px;left:0;right:0;text-align:center;font-size:.72rem;color:#CDB9D6;opacity:0;animation:ifade 1s 3s forwards;font-weight:800}
@keyframes ifade{to{opacity:1}}
#intro .sw{position:absolute;top:0;bottom:0;width:110px;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160px) skewX(-20deg);will-change:transform;opacity:0;animation:isw 1.2s 1.9s ease-in-out forwards;z-index:3}
@keyframes isw{0%{opacity:1;transform:translateX(-160px) skewX(-20deg)}100%{opacity:1;transform:translateX(130vw) skewX(-20deg)}}
#intro .sp{position:absolute;width:10px;height:10px;background:#FFD36B;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:itw 2s ease-in-out infinite}
@keyframes itw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}

$('snd').textContent=soundOn?'🔊':'🔇';

/* ---------- burbujas de letras ---------- */
mods.bub=(function(){
  var cv=$('bbc'), cx=cv.getContext('2d'), stg=$('bbs'), W0=360, H=620, raf=0, run=false, bs=[], ps=[], last=0, spT=0, n=0, dpr=Math.min(window.devicePixelRatio||1,2.5), sc=1, mode='abc';

/* ---------- con qué letra empieza (y vocales) ---------- */
